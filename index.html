<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THé VhS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <div id="stage">
      <div id="hud">
        <div id="hud-left">
          <span class="rec-dot"></span>
          <span id="hud-title">THé VhS</span>
        </div>
        <div id="hud-clock">11:00 PM</div>
      </div>

      <section id="sc-counter" class="scene active">
        <img class="bg-img" src="assets/bg_shop_counter.png" alt="Shop counter">
        <img id="cust-human" class="sprite hidden" src="assets/char_customer_human.png" alt="Customer">
        <img id="desk-tape" class="sprite hidden" src="assets/prop_vhs_tape.png" alt="VHS tape">

        <div id="shift-note" class="hidden">
          <h3>NIGHT SHIFT NOTES</h3>
          <ul>
            <li>1. Lock front deadbolt at 11:00 PM sharp.</li>
            <li>2. Back storage latch is loose again. Ignore any tapping.</li>
            <li>3. Warm VCR attracts those weird bugs. If one shows up, FREEZE.</li>
          </ul>
          <button id="btn-close-note" class="vhs-btn">[ PUT NOTE DOWN ]</button>
        </div>

        <div id="cnt-ui" class="dlg-box">
          <p id="cnt-txt"></p>
          <div id="cnt-btns" class="btn-row"></div>
        </div>
      </section>

      <section id="sc-bench" class="scene">
        <img class="bg-img" src="assets/bg_workbench_zoom.png" alt="Workbench">
        <canvas id="bench-cv" width="960" height="540"></canvas>

        <div id="bench-hdr">STEP 1/3: UNSCREW CASING (0/4)</div>

        <div id="ribbon-box" class="hidden">
          <div class="rib-lbl">STEP 3/3: HOLD ALIGN IN GREEN ZONE</div>
          <div id="rib-track">
            <div id="rib-zone"></div>
            <div id="rib-needle"></div>
          </div>
          <div id="rib-prog-wrap"><div id="rib-prog"></div></div>
          <button id="btn-align" class="vhs-btn">[ HOLD TO ALIGN ]</button>
        </div>

        <div id="bench-done" class="btn-row hidden">
          <button id="btn-vcr" class="vhs-btn">[ INSERT INTO VCR ]</button>
        </div>
      </section>

      <canvas id="stat-cv" width="320" height="180"></canvas>
      <div id="scanlines"></div>
      <div id="flash"></div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
